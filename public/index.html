<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  // Apply the saved theme, and mark whether a session looks logged-in, before
  // first paint - so there's no flash of the wrong theme or of the barebone
  // auth screen. This has to run in <head>, before the body's HTML is even
  // parsed, and the has-session result has to be applied via CSS (not a
  // script later in <body>) so there's no moment where the auth screen can
  // get painted un-hidden first. Real session validation still happens in
  // script.js; this only prevents the flash while that check runs.
  (function () {
    try {
      var t = localStorage.getItem("circle-theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
      var hasSession = Object.keys(localStorage).some(function (key) {
        return key.indexOf("sb-") === 0 && key.indexOf("-auth-token") !== -1 && localStorage.getItem(key);
      });
      if (hasSession) document.documentElement.classList.add("has-session");
      // If a conversation was open when the page was last refreshed, mark
      // that too, so the CSS below can pre-paint the chat screen straight
      // away instead of flashing the chats list first.
      if (hasSession && sessionStorage.getItem("circle-open-chat")) {
        document.documentElement.classList.add("has-open-chat");
      }
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Chat</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0E1116" />
<!-- Inlined rather than linked: Firefox can paint the page before a separate
     stylesheet request resolves (notably on reload, while revalidating the
     cached file), which shows the bare unstyled HTML for a split second.
     With the CSS inside the document, the first paint is always styled. -->
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  /* Suppresses the default mobile blue/gray tap-highlight box that Chrome
     and Safari flash on any tappable element when it's tapped. */
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #0E1116;
  --surface: #1B2028;
  --surface-2: #232A34;
  --mine-bg: #1F6F5C;
  --mine-text: #FFFFFF;
  --theirs-bg: #232A34;
  --theirs-text: #E9EDF1;
  --text: #E9EDF1;
  --text-dim: #6B7480;
  --accent: #E0A72E;
  --accent-text: #1B1300;
  --danger: #C4574B;
  --border: #232A34;
  /* Desktop two-pane divider: needs more contrast than --border in light
     mode, where #E9EDEF sits invisibly between the white panes. */
  --pane-divider: #232A34;
}

/* WhatsApp-style light theme */
[data-theme="light"] {
  --bg: #ECE5DD;
  --surface: #FFFFFF;
  --surface-2: #FFFFFF;
  --mine-bg: #DCF8C6;
  --mine-text: #111B21;
  --theirs-bg: #FFFFFF;
  --theirs-text: #111B21;
  --text: #111B21;
  --text-dim: #667781;
  --accent: #00A884;
  --accent-text: #FFFFFF;
  --danger: #C4574B;
  --border: #E9EDEF;
  --pane-divider: #D1D7DB;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  /* Telegram-ish default scale: everything in rem/em below inherits this */
  font-size: 16.5px;
}

/* ---------- Text selection policy ----------
   Selection is disabled sitewide: on touch devices an accidental
   touch-and-hold (or a finger that drifts a few px while tapping) makes the
   browser run its selection drag and flash a blue highlight over headers,
   list rows, buttons, etc. Setting it on <html> covers every descendant,
   because user-select:auto (the default) resolves to the parent's used
   value. Elements below opt back in explicitly. -webkit-touch-callout:none
   also suppresses the iOS long-press callout sheet outside the chat. */
html {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* Form controls must stay fully editable/selectable — on iOS an inherited
   user-select:none can otherwise make an input impossible to type into. */
input, textarea {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}
/* Message text stays selectable so users can hold/copy important info.
   The supporting furniture inside a bubble opts back out — a selection
   starting on the message text must not swallow it:
   .meta        — the time + tick row
   .sender-name — the author label above the text
   .quoted-msg  — the reply preview; to copy the original, tap it to jump
                  to the source message and select there */
.bubble {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}
.bubble .meta,
.bubble .sender-name,
.bubble .quoted-msg {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* Slim, unobtrusive scrollbars (Telegram-style) */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: rgba(127,127,127,0.35); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(127,127,127,0.55); }
::-webkit-scrollbar-track { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: rgba(127,127,127,0.35) transparent; }

/* Smooth light/dark cross-fade: the theme swaps CSS variables on <html>, and
   variables themselves can't animate — but the properties consuming them do,
   when the element has a transition for them. Rule order matters: every
   element gets these theme-property transitions by default; rules that need
   a different transition (html/body below, .reply-trigger, .jump-bottom…)
   come later or carry higher specificity, so they still win. */
@media (prefers-reduced-motion: no-preference) {
  * {
    transition: background-color 0.3s ease, color 0.3s ease,
                border-color 0.3s ease;
    /* box-shadow deliberately NOT transitioned: in light theme every message
       bubble carries a box-shadow, so animating it re-renders (not just
       repaints) hundreds of bubbles per frame inside a long conversation —
       that's what made the toggle stutter on the chat screen. The shadow
       now swaps instantly instead of fading, which is imperceptible. */
  }
  html, body { transition: background-color 0.3s ease, color 0.3s ease; }
}

.hidden { display: none !important; }
.hidden-field { display: none; }

/* ---------- Fade in / fade out ----------
   JS's showEl()/hideEl() drive these: hideEl() adds .fade-out (opacity
   transition runs while the element is still rendered), then swaps in
   .hidden once it completes; showEl() reveals with .fade-out pre-applied
   and removes it next frame so the element transitions in. */
/* background/color kept from the universal theme cross-fade rule, which this
   more specific transition property list would otherwise override. */
/* transform is transitioned (briefly) so a step change of --app-offset-top —
   the keyboard pinning offset on browsers that scroll instead of resize —
   eases in instead of jumping the whole screen by a few pixels in one frame. */
.screen { transition: opacity 0.18s ease, transform 0.15s ease, background-color 0.3s ease, color 0.3s ease; }
/* While the keyboard is already open and the browser is only scrolling the
   visual viewport to reveal a newly focused field (auth form: name →
   username → password), the pinning offset changes without the keyboard
   itself moving. Easing those steps animated the whole screen against the
   browser's own viewport movement — a visible stutter on every field
   switch — so follow them instantly by dropping just the transform
   transition. script.js toggles this class on html. */
html.kb-following-scroll .screen {
  transition: opacity 0.18s ease, background-color 0.3s ease, color 0.3s ease;
}
/* Screens live in normal flow, so during a cross-fade the outgoing one must
   overlay instead of stacking (two 100dvh blocks would double the page
   height). Fixed + inset:0 lifts it out of flow for the fade's duration. */
.screen.fade-out { position: fixed; inset: 0; z-index: 50; }

.search-results,
.settings-overlay,
.reply-preview,
.composer-error,
.typing-indicator {
  transition: opacity 0.18s ease, transform 0.18s ease,
              background-color 0.3s ease, border-color 0.3s ease;
}
.fade-out { opacity: 0 !important; pointer-events: none; }
/* Popovers settle upward/outward when appearing, reverse when leaving. */
.search-results.fade-out { transform: translateY(-6px); }
/* The settle-scale belongs on the CARD, never the overlay: scaling the
   overlay shrinks the backdrop rectangle away from the screen edges, which
   shows the dim as a grey rectangle with visible boundaries while it fades.
   The card shrinking slightly reads as the dialog "settling" instead. */
.settings-overlay.fade-out .settings-card { transform: scale(0.98); }
.reply-preview.fade-out { transform: translateY(100%); }
.composer-error.fade-out { transform: translateY(100%); }
.jump-bottom { transition: opacity 0.18s ease, transform 0.18s ease, filter 0.15s ease, background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }
.jump-bottom.fade-out { transform: translateY(8px); }

.screen { height: 100dvh; height: calc(var(--app-height, 100dvh)); display: flex; flex-direction: column; position: relative; transform: translateY(var(--app-offset-top, 0px)); }

/* ---------- Auth ---------- */
/* The auth screen opts OUT of the keyboard-pinning translateY (.screen applies
   it via --app-offset-top) AND out of document flow entirely. With the
   keyboard open, tapping between the fields makes the browser scroll to
   reveal the newly focused input; while the screen was in normal flow it
   scrolled the whole <html> document for a frame and snapped back — the
   millisecond whole-screen jerk on every field switch. position:fixed leaves
   the page underneath with nothing to scroll, so only this container can
   move: overflow-y:auto + margin:auto centering let the browser's native
   focus-scroll reveal any field inside the card smoothly. The chat composer
   still needs the pinning; the auth form never did. */
#auth-screen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  align-items: center;
  padding: 24px;
  transform: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.auth-card { width: 100%; max-width: 380px; text-align: center; margin: auto; }

.auth-title { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px; }
.auth-sub { color: var(--text-dim); font-size: 15px; margin-bottom: 28px; }

#auth-form { display: flex; flex-direction: column; gap: 11px; }

#auth-form input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 15px;
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s ease, background-color 0.3s ease;
}
#auth-form input:focus { border-color: var(--accent); }

#auth-submit {
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
}
#auth-submit:hover { filter: brightness(1.05); }
#auth-submit:active { opacity: 0.85; }

.link-button {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 14px;
  margin-top: 18px;
  cursor: pointer;
}
.link-button:hover { text-decoration: underline; }

.auth-error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 16px; }

/* ---------- Chat ---------- */
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-header-info { display: flex; flex-direction: column; }
.chat-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.chat-sub { font-size: 13px; color: var(--text-dim); }

/* The chat screen's own header (partner name) sits directly above the
   encryption notice, so it's trimmed to a slimmer bar rather than the
   chats-list header's full-size padding/type. */
#chat-screen .chat-header {
  padding: 6px 14px;
  padding-top: max(6px, env(safe-area-inset-top));
}
#chat-screen .chat-header .icon-button { padding: 6px; font-size: 17px; }
#chat-screen .chat-title { font-size: 16px; }
#chat-screen .chat-sub { font-size: 12px; }

.header-actions { display: flex; align-items: center; gap: 2px; }

/* The chat screen's header now only has the back button + the partner's
   name (the per-chat theme toggle was removed) — space-between would push
   the name all the way to the far right with nothing to balance it, so this
   screen's header left-aligns its two items instead of spreading them. The
   chats-list screen's header still uses space-between above, since its two
   items (title, header-actions) are meant to sit at opposite edges. */
#chat-screen .chat-header { justify-content: flex-start; }

.icon-button {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 19px;
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}
.icon-button:hover { color: var(--text); background: rgba(127,127,127,0.12); }
.icon-button:active { background: rgba(127,127,127,0.2); }
.icon-button svg { display: block; }

/* Snappier hover feedback: the universal theme cross-fade rule at the top of
   the stylesheet also transitions background-color over 0.3s, which made the
   small icon buttons' hover highlight fade in/out slowly enough to feel
   laggy. Keep the slow theme fade for border-color, speed up the rest. */
.icon-button {
  transition: background-color 0.12s ease, color 0.12s ease, border-color 0.3s ease;
}

/* ---------- Custom hover tooltips ----------
   Native title= tooltips are replaced by a styled ::after bubble on any
   element carrying a data-tip attribute (header icon buttons, the chat
   header's partner name): rounded, theme-aware, appearing a short grace
   period after the cursor settles so sweeping across the header buttons
   doesn't pop a tooltip for every button merely passed over (that, plus the
   slow hover fade above, is what read as "stuttery"). background/border/
   color are re-listed so this rule's transition doesn't drop the theme
   cross-fade the universal rule provides. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%) translateY(-3px);
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 5px 10px;
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.25;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  opacity: 0;
  pointer-events: none;
  z-index: 30;
  transition: opacity 0.15s ease, transform 0.15s ease,
              background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
[data-tip]:hover::after,
[data-tip]:focus-visible::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  /* The grace period: hover-in waits ~half a second; hover-out uses the base
     rule's 0 delay, so the bubble leaves as soon as the cursor moves on. */
  transition-delay: 0.45s, 0.45s, 0s, 0s, 0s;
}

/* ---------- Presence (online dot) ----------
   A green dot appears next to a user's name while their app is connected
   (see buildPresenceChannel in script.js). Shown in the open conversation's
   header and on every chats-list row; carries a styled "Online" tooltip. */
.presence-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #22C55E;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
  flex-shrink: 0;
}
/* Header dot pins to the header's right edge (the screen's flex-start
   override would otherwise hug it next to the name); list rows group it
   with the timestamp on the top line instead of letting it float beside
   the info block, where it visually unseats the time from the edge. */
#chat-screen .chat-header .presence-dot { margin-left: auto; }
.chat-item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

/* Mobile has no hover: a long-press (~450ms) adds .tip-on via attachTipHold()
   in script.js to show the same tooltip bubble instantly — the JS wait
   replaces the hover grace period — and it lingers briefly after the finger
   lifts so it can actually be read. */
[data-tip].tip-on::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Dots pinned to a row's right edge (chats list) anchor the bubble to the
   same edge: centering it under the dot would push most of the bubble past
   the screen edge, where the scroll container clips it. */
[data-tip].tip-edge::after {
  left: auto;
  right: 0;
  transform: translateY(-3px);
}
[data-tip].tip-edge:hover::after,
[data-tip].tip-edge:focus-visible::after,
[data-tip].tip-edge.tip-on::after {
  transform: translateY(0);
}

/* ---------- Encryption notice (top of every conversation) ---------- */
.encryption-notice {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 4px 14px;
  font-size: 11.5px;
  color: var(--text-dim);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.encryption-notice svg { flex-shrink: 0; opacity: 0.75; }

.message-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: relative;
}

.msg-row { display: flex; margin-bottom: 2px;
  /* content-visibility: auto was previously used here to skip rendering
     off-screen rows, but its 44px placeholders made the scroll height change
     on the fly as real heights registered mid-scroll — the scrollbar jumped
     and content shifted under the finger on first pass through history.
     History is capped at 200 messages, so rendering everything up front is
     affordable and makes the scrollbar exact from the first paint. */ }
.msg-row.grouped { margin-bottom: 2px; }
.msg-row.group-start { margin-top: 10px; }
.msg-row.mine { justify-content: flex-end; }
.msg-row.theirs { justify-content: flex-start; }

.bubble {
  max-width: min(74%, 440px);
  padding: 9px 13px;
  border-radius: 14px;
  font-size: 16px;
  line-height: 1.4;
  word-wrap: break-word;
  box-shadow: 0 1px 1px rgba(11, 20, 26, 0.14);
}
.mine .bubble { background: var(--mine-bg); color: var(--mine-text); border-bottom-right-radius: 6px; }
.theirs .bubble { background: var(--theirs-bg); color: var(--theirs-text); border-bottom-left-radius: 6px; }

/* Tighten the tail-corner only on the last bubble of a consecutive group */
.mine .bubble { border-radius: 14px; }
.theirs .bubble { border-radius: 14px; }
.msg-row.mine.group-last .bubble { border-bottom-right-radius: 6px; }
.msg-row.theirs.group-last .bubble { border-bottom-left-radius: 6px; }

[data-theme="light"] .bubble { box-shadow: 0 1px 1px rgba(11, 20, 26, 0.13); }
[data-theme="dark"] .bubble { box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.3); }

.bubble .sender-name {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 2px;
}

.bubble .meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  margin-top: 3px;
}
.theirs .bubble .meta { color: var(--text-dim); }
[data-theme="light"] .mine .bubble .meta { color: rgba(17,27,33,0.55); }

.bubble .meta .tick { display: inline-flex; }
.bubble .meta .tick svg { height: 15px; width: auto; display: block; }
.bubble .meta .tick.seen { color: #53BDEB; }
.bubble .meta .tick.pending { opacity: 0.5; }

.bubble img.media {
  max-width: 100%;
  border-radius: 10px;
  display: block;
  margin-bottom: 4px;
  cursor: pointer;
}

.media-file {
  display: block;
  margin-bottom: 4px;
  padding: 9px 13px;
  border-radius: 10px;
  background: rgba(127, 127, 127, 0.15);
  color: inherit;
  text-decoration: none;
  font-size: 15px;
}

/* ---------- Reply-to ---------- */
.msg-row { align-items: flex-end; }

.reply-trigger {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  box-sizing: border-box;
  padding: 0; /* padding only appears when revealed — border-box can't shrink below its own padding, so a fixed padding here would keep reserving space even at width:0 */
  width: 0; /* collapsed at rest — reserves no space, so bubbles stay flush to the edge */
  min-width: 0; /* flex items default to min-width:auto, which ignores width:0 when there's content */
  overflow: hidden;
  opacity: 0; /* revealed by hover (desktop) or swipe (mobile, via JS) */
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent; /* no blue flash on tap/long-press */
  /* width/padding/opacity drive the swipe reveal; background-color/color are
     added so this rule's transition list doesn't override (and thus drop) the
     theme cross-fade the universal * rule sets for everything else. */
  transition: width 0.18s ease, padding 0.18s ease, opacity 0.15s ease,
              background-color 0.3s ease, color 0.3s ease;
}
.reply-trigger:focus { outline: none; }
.reply-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Desktop / mouse: reveal on hover over the row */
@media (hover: hover) and (pointer: fine) {
  /* "mine" rows: put the icon before the bubble visually (DOM order stays
     the same, so mobile's swipe/overlap logic isn't affected) so the
     bubble — not the icon — is the item anchored to the row's edge, and
     stays put on hover instead of shifting left. */
  .msg-row.mine .reply-trigger { order: -1; }

  .msg-row:hover .reply-trigger { width: 34px; padding: 6px; opacity: 0.55; }
  .reply-trigger:hover { opacity: 1; }
}

/* Touch devices: no hover affordance, so make the tap target bigger */
@media (hover: none) and (pointer: coarse) {
  .reply-trigger { font-size: 26px; }
}

/* Desktop click feedback: bubble + icon nudge left together, then settle
   back, so clicking the reply icon reads as a deliberate little "punch"
   rather than an instant no-op. Transform-based (not the flex reflow used
   at rest) so it applies the same way to mine and theirs rows. */
@keyframes reply-bounce {
  0% { transform: translateX(0); }
  35% { transform: translateX(-8px); }
  100% { transform: translateX(0); }
}
.msg-row.reply-bounce .bubble,
.msg-row.reply-bounce .reply-trigger {
  animation: reply-bounce 0.22s ease;
}

/* Let JS own horizontal swipe gestures while still allowing normal vertical scroll. */
.bubble { touch-action: pan-y; }

.quoted-msg {
  display: flex;
  flex-direction: column;
  gap: 1px;
  border-left: 3px solid var(--accent);
  background: rgba(127, 127, 127, 0.15);
  border-radius: 6px;
  padding: 5px 9px;
  margin-bottom: 6px;
  cursor: pointer;
  max-width: 100%;
}
.quoted-msg:hover { background: rgba(127, 127, 127, 0.22); }
.quoted-name { font-size: 13px; font-weight: 600; color: var(--accent); }
.quoted-body {
  font-size: 14px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mine .quoted-body { color: rgba(255,255,255,0.75); }
[data-theme="light"] .mine .quoted-body { color: rgba(17,27,33,0.6); }

/* Outlined rather than box-shadowed: bubbles already carry their own
   (theme- and side-dependent) box-shadow, so animating box-shadow would
   override it and end on "none", making the flash pop differently on
   mine-vs-theirs bubbles and per theme. An outline draws on top of whatever
   the bubble has, so the flash looks identical everywhere. */
.msg-row.highlight-flash .bubble {
  outline: 2px solid transparent;
  outline-offset: 2px;
  animation: flash 1.2s ease-out;
}

  0% { outline-color: var(--accent); }

/* ---------- Chats list ---------- */
.chat-header .chat-header-info { min-width: 0; }

#user-search {

.chat-list {

.chat-item {

.chat-item:active { filter: brightness(0.96); }

/* ---------- Placeholder (right pane, desktop only) ---------- */
/* Hidden everywhere by default; the desktop media query below shows it while
   no conversation is open. */
#chat-placeholder {
  display: none;

  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: var(--text-dim);
  font-size: 15px;
  background: var(--surface-2);
  /* Fades in via the shared .fade-out mechanism (script.js removes the class
     the frame after the placeholder is revealed, once a conversation closes). */
  transition: opacity 0.18s ease, background-color 0.3s ease;
}
#chat-placeholder svg { opacity: 0.45; }

/* ---------- Desktop two-pane layout (WhatsApp/Telegram style) ----------
   On wide screens the chats list becomes a permanently visible left pane and
   the conversation opens in the right pane; below the breakpoint nothing
   changes and the original one-screen-at-a-time flow is untouched.

   Everything here is scoped to html.app-visible (set by enterApp, removed
   when the user is signed out) so the overrides can't leak onto the auth
   screen. The right pane's visibility is driven by html.chat-open, which JS
   mirrors from openConversation()/closeConversation(). The mobile
   .hidden/.fade-out screen switching keeps running underneath — on desktop
   the overrides here simply neutralize it for the list pane (so hiding it
   while a chat opens can't blank the left side), while the right pane keeps
   using it as-is. */
@media (min-width: 768px) {
  html.app-visible .app-layout {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    height: 100dvh;
    height: calc(var(--app-height, 100dvh));
    transform: translateY(var(--app-offset-top, 0px));
  }
  html.app-visible .app-layout .screen { height: 100%; transform: none; }

  /* Left pane: always visible. The !important overrides beat the mobile
     .hidden / .fade-out rules that openConversation() still applies to it. */
  html.app-visible #chats-screen {
    display: flex !important;
    opacity: 1 !important;
    position: relative !important;
    flex: 0 0 30%;
    min-width: 320px;
    max-width: 420px;
    border-right: 1px solid var(--pane-divider);
  }

  html.app-visible #chat-screen { flex: 1; min-width: 0; }

  /* While a screen fades out, the mobile rules lift it out of flow with
     position:fixed inset:0 — on desktop that would stretch the fading
     conversation across BOTH panes, blanking the chats list for the fade's
     duration. Keep fading screens as normal flex panes instead: each one
     simply fades out in place, exactly like before the two-pane layout. */
  html.app-visible .screen.fade-out { position: relative; inset: auto; z-index: auto; }

  /* Right pane only exists while a chat is open; otherwise the placeholder
     fills the space. During the pre-JS flash-prevention window on a refresh
     inside a chat, the has-session CSS force-shows #chat-screen (higher
     specificity), so .has-open-chat is excluded here to keep the placeholder
     and the conversation from showing side by side in that brief moment. */
  html.app-visible:not(.chat-open) #chat-screen { display: none !important; }
  html.app-visible:not(.chat-open):not(.has-open-chat) #chat-placeholder { display: flex; }
}

.jump-bottom {
  position: absolute;
  right: 16px;
  /* Anchored to .composer-stack: bottom:100% floats the button directly
     above the stack's top edge — above the reply strip (and its ✕) when a
     reply is active, above the input bar otherwise. The 10px gap keeps it
     clear of the strip's shadow/edge. */
  bottom: 100%;
  margin-bottom: 10px;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);

  padding: 8px 14px;

  box-shadow: 0 4px 14px rgba(0,0,0,0.3);

  align-items: center;
  gap: 4px;
  z-index: 5;
}
.jump-bottom:hover { filter: brightness(1.08); }
#jump-bottom-count:empty { display: none; }

/* ---------- Composer ---------- */
/* Wraps reply-preview + composer-error + composer so the jump-bottom button
   can anchor to the stack's top edge: when the reply strip opens, the stack
   grows upward and carries the button with it, keeping the button above the
   ✕ instead of on top of it. */
.composer-stack {
  position: relative;
  flex-shrink: 0;
}

.composer-error {
  padding: 6px 16px;
  font-size: 14px;
  color: var(--danger);
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.composer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;

  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#message-input {

#message-input:focus { border-color: var(--accent); }
[data-theme="light"] #message-input { border: 1px solid var(--border); }
[data-theme="light"] #message-input:focus { border-color: var(--accent); }

.send-button {

.send-button:hover { filter: brightness(1.05); }
.send-button:active { opacity: 0.85; transform: scale(0.95); }

@media (prefers-reduced-motion: no-preference) {
  /* Only on rows arriving live while the chat is open (.animate-in is added
     by JS). Applying it to .msg-row itself made the ENTIRE history replay the
     animation whenever it was re-rendered — most visibly right after a page
     refresh, where the whole list visibly flickered/jittered into place. */
  .msg-row.animate-in { animation: rise 0.15s ease-out; }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Settings modal ---------- */
.settings-overlay {
  position: fixed;
  /* Sized from --app-height (kept in sync with the screens by script.js)
     instead of inset-bottom, so the dialog re-centers inside the keyboard-
     shrunken visible area in the same frame the composer moves — tracking
     the layout viewport instead let the two move a frame apart, which read
     as a one-off jitter while the keyboard animated. */
  top: 0;
  left: 0;
  right: 0;
  height: calc(var(--app-height, 100dvh));
  transform: translateY(var(--app-offset-top, 0px));
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 10;

     the screens instantly (their transform eases briefly instead). Opacity
     still fades; the settle-scale lives on .settings-card below. */
  transition: opacity 0.18s ease, background-color 0.3s ease, border-color 0.3s ease;
}
.settings-card {
  width: 100%;
  max-width: 380px;

.settings-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 14px; }
.settings-label { display: block; font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }
.settings-hint { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
#settings-name {

  padding: 13px 14px;

#settings-name:focus { border-color: var(--accent); }
.settings-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 16px; }
.settings-actions .link-button { margin-top: 0; }
#settings-save {

#settings-save:hover { filter: brightness(1.05); }
#settings-save:active { opacity: 0.85; }
#settings-save:disabled { opacity: 0.6; cursor: default; }

/* ---------- Auth-screen password toggle (page-specific) ---------- */
.password-field { position: relative; width: 100%; }
  .password-field #auth-password { padding-right: 48px; width: 100%; box-sizing: border-box; }
  .password-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; padding: 0; border: 0; background: transparent;
    color: inherit; display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0.75;
  }
  .password-toggle:hover, .password-toggle:focus-visible { opacity: 1; }
  .password-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 6px; }

  /* Paired with the has-session class set in the head script above: applies

     real auth check, so refreshing while logged in never shows a flash of the

     When a conversation was open (has-open-chat), pre-paint the chat screen
     instead of the chats list, so refreshing inside a chat stays in that
     chat instead of flashing the list before script.js switches screens. */
  html.has-session #auth-screen { display: none !important; }
  html.has-session:not(.has-open-chat) #chats-screen.hidden { display: flex !important; }
  html.has-session.has-open-chat #chat-screen.hidden { display: flex !important; }
</style>

// ---------- End-to-end encryption (E2EE) ----------
// Built on the browser's native WebCrypto — no external dependency.
//
// Model:
//   Every user has an ECDH P-256 keypair. The public key is published in
//   profiles.public_key; the private key lives on the device (localStorage)
//   and is ALSO stored in profiles.enc_private_key wrapped with a key derived
//   from the login password (PBKDF2), so a new device can recover it at
//   login. That is why the password must be typed once per device — Supabase
//   never sees the unwrapped key, but does see the password at login, which
//   is the documented limit of this threat model.
//
// Messages:
//   The payload {b: text, mk: media key, mi: media iv} is encrypted once for
//   the recipient (ECDH(sender, recipient)) and once for the sender's own
//   other devices (ECDH(sender, sender)), and stored in messages.body as
//   "enc:v1:{json}" (the prefix keeps legacy plaintext rows readable).
//   Photos are encrypted with a random AES-GCM key before upload; that key
//   travels inside the encrypted payload, so Storage only holds ciphertext.
//
// Push previews:
//   The sender additionally encrypts the notification preview to the
//   recipient and stores it in messages.notify. The Cloudflare worker relays
//   it unread; sw.js decrypts it on the phone. The server never sees text.

const CircleCrypto = (() => {
  const PREFIX = "enc:v1:"; // marker identifying encrypted message bodies
  const LS_KEY = "circle-e2ee-key:"; // + user id → private key JWK on this device
  const MSG_INFO = "circle-msg-v1"; // key-derivation labels; must match sw.js
  const NOTIFY_INFO = "circle-notify-v1";
  const IDB_NAME = "circle-e2ee";
  const IDB_STORE = "kv";

  let myUserId = null;
  let myPriv = null; // CryptoKey (ECDH private)
  let myPubRaw = null; // Uint8Array, raw public key
  let myPubB64 = null; // same, base64

  const pubKeyCache = {}; // userId -> base64 public key
  // "peerB64|info" -> derived CryptoKey. The derivation is deterministic for a
  // given (my key, peer key, purpose label), so caching it turns every seal/
  // unseal after the first into a single AES-GCM call instead of a full ECDH
  // round trip per message. Cleared whenever a different private key is
  // adopted (sign-in as another user), which invalidates every entry.
  const aesKeyCache = {};

  // ---------- encoding helpers ----------
  function b64(bytes) {
    const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    let bin = "";
    for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
    return btoa(bin);
  }

  function unb64(s) {
    const bin = atob(s);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();

  function concatBytes(...parts) {
    const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
    let off = 0;
    for (const p of parts) {
      out.set(p, off);
      off += p.length;
    }
    return out;
  }

  // ---------- IndexedDB (shares the key with the service worker) ----------
  // localStorage isn't available inside a service worker, so the page stashes
  // the private key JWK there for sw.js to read when a push arrives.
  function idbOpen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbPut(key, value) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  // ---------- key management ----------
  async function pubRawFromJwk(jwk) {
    // The public half is embedded in the private JWK (x/y coords).
    const pubJwk = { kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y, ext: true, key_ops: [] };
    const pub = await crypto.subtle.importKey("jwk", pubJwk, { name: "ECDH", namedCurve: "P-256" }, true, []);
    return new Uint8Array(await crypto.subtle.exportKey("raw", pub));
  }

  async function adoptKey(userId, jwk) {
    myUserId = userId;
    myPriv = await crypto.subtle.importKey("jwk", jwk, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
    myPubRaw = await pubRawFromJwk(jwk);
    myPubB64 = b64(myPubRaw);
    // Keys derived under the previous private key are no longer valid.
    for (const k of Object.keys(aesKeyCache)) delete aesKeyCache[k];
  }

  async function fetchPublicKey(userId) {
    if (pubKeyCache[userId]) return pubKeyCache[userId];
    const { data, error } = await supabaseClient
      .from("profiles")
      .select("public_key")
      .eq("id", userId)
      .maybeSingle();
    if (error || !data || !data.public_key) return null;
    pubKeyCache[userId] = data.public_key;
    return pubKeyCache[userId];
  }

  async function passwordWrapKey(password, userId, usages) {
    const base = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: encoder.encode("circle-e2ee:" + userId), iterations: 310000, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      usages
    );
  }

  // Unlocks (or first-time creates) this account's keypair. The password is
  // only required the first time on a given device; afterwards the key is
  // cached in localStorage and refreshes skip straight past this.
  // Returns true when this device can encrypt/decrypt.
  async function setupKeys(userId, password) {
    try {
      const cached = localStorage.getItem(LS_KEY + userId);
      if (cached) {
        await adoptKey(userId, JSON.parse(cached));
        await idbPut("private-key", cached);
        return true;
      }

      let jwk = null;
      const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("public_key, enc_private_key")
        .eq("id", userId)
        .maybeSingle();
      if (error) throw error;

      if (profile && profile.enc_private_key && password) {
        // Recovering the key on a new device: unwrap the stored blob with the
        // login password. Auth already verified the password is correct, so a
        // failure here means the blob itself is unusable.
        const blob = JSON.parse(decoder.decode(unb64(profile.enc_private_key)));
        const wrapKey = await passwordWrapKey(password, userId, ["decrypt"]);
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv) }, wrapKey, unb64(blob.ct));
        jwk = JSON.parse(decoder.decode(plain));
      } else if (password) {
        // First login since E2EE was enabled (new or pre-existing account):
        // generate a keypair, publish the public half, and store the private
        // half wrapped with the password so other devices can recover it.
        const pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
        jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);
        const publishedPub = b64(await crypto.subtle.exportKey("raw", pair.publicKey));
        const wrapKey = await passwordWrapKey(password, userId, ["encrypt"]);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, wrapKey, encoder.encode(JSON.stringify(jwk)));
        const wrapped = b64(encoder.encode(JSON.stringify({ v: 1, iv: b64(iv), ct: b64(ct) })));
        const { error: upErr } = await supabaseClient
          .from("profiles")
          .update({ public_key: publishedPub, enc_private_key: wrapped })
          .eq("id", userId);
        if (upErr) throw upErr;
        pubKeyCache[userId] = publishedPub;
      } else {
        // Session restored (refresh) without a local key and no password in
        // hand — can't unlock. The caller degrades gracefully to plaintext.
        return false;
      }

      const jwkStr = JSON.stringify(jwk);
      await adoptKey(userId, jwk);
      localStorage.setItem(LS_KEY + userId, jwkStr);
      await idbPut("private-key", jwkStr);
      return true;
    } catch (err) {
      console.error("E2EE key setup failed:", err);
      return false;
    }
  }

  function ready() {
    return !!myPriv;
  }

  // Lets the page prime the cache with public keys it already fetched.
  function cachePublicKey(userId, publicKeyB64) {
    if (publicKeyB64) pubKeyCache[userId] = publicKeyB64;
  }

  // ---------- primitives ----------
  // AES-GCM key from the ECDH shared secret, bound to both public keys and a
  // purpose label. Mirrored in sw.js for push previews — keep in sync.
  async function aesKeyFor(peerRawBytes, info) {
    const peerB64 = b64(peerRawBytes);
    const cacheId = peerB64 + "|" + info;
    const cached = aesKeyCache[cacheId];
    if (cached) return cached;
    const peer = await crypto.subtle.importKey("raw", peerRawBytes, { name: "ECDH", namedCurve: "P-256" }, false, []);
    const shared = new Uint8Array(await crypto.subtle.deriveBits({ name: "ECDH", public: peer }, myPriv, 256));
    const [p1, p2] = myPubB64 < peerB64 ? [myPubRaw, peerRawBytes] : [peerRawBytes, myPubRaw];
    const digest = new Uint8Array(
      await crypto.subtle.digest("SHA-256", concatBytes(shared, p1, p2, encoder.encode(info)))
    );
    const key = await crypto.subtle.importKey("raw", digest, { name: "AES-GCM", length: 256 }, false, [
      "encrypt",
      "decrypt",
    ]);
    aesKeyCache[cacheId] = key;
    return key;
  }

  async function seal(peerRaw, obj, info) {
    const key = await aesKeyFor(peerRaw, info);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoder.encode(JSON.stringify(obj))));
    return b64(concatBytes(iv, ct));
  }

  async function unseal(peerRaw, blobB64, info) {
    const raw = unb64(blobB64);
    const key = await aesKeyFor(peerRaw, info);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(decoder.decode(plain));
  }

  // ---------- outgoing ----------
  // payload: { b: plaintext|null, mk: mediaKeyB64|null, mi: mediaIvB64|null }
  // preview: short notification text ("hello" / "📷 Photo").
  // Returns { body, notify }, or null when the recipient has no published key
  // (caller falls back to a legacy plaintext row so nothing is lost).
  async function encryptOutgoing(partnerId, payload, preview) {
    if (!ready()) return null;
    const partnerPub = await fetchPublicKey(partnerId);
    if (!partnerPub) return null;
    const partnerRaw = unb64(partnerPub);
    // The three seals are independent — run them concurrently instead of
    // chaining three sequential crypto round trips on the send path.
    const [r, s, notifySeal] = await Promise.all([
      seal(partnerRaw, payload, MSG_INFO), // readable by the recipient
      seal(myPubRaw, payload, MSG_INFO), // readable by my own devices
      seal(partnerRaw, { b: preview }, NOTIFY_INFO),
    ]);
    const container = {
      v: 1,
      k: myPubB64, // sender's public key — the recipient needs it to derive the key
      r,
      s,
    };
    const notify = b64(encoder.encode(JSON.stringify({ spk: myPubB64, d: notifySeal })));
    return { body: PREFIX + JSON.stringify(container), notify };
  }

  // ---------- incoming ----------
  // Turns a raw row into a "view": body decrypted, media key/iv attached.
  // Legacy plaintext rows pass through untouched (_encrypted: false).
  async function decryptRow(row) {
    if (!row || typeof row.body !== "string" || !row.body.startsWith(PREFIX)) {
      return Object.assign({}, row, { _encrypted: false });
    }
    try {
      const container = JSON.parse(row.body.slice(PREFIX.length));
      const mine = container.k === myPubB64; // my own message (another device)?
      const peerRaw = mine ? myPubRaw : unb64(container.k);
      const payload = await unseal(peerRaw, mine ? container.s : container.r, MSG_INFO);
      return Object.assign({}, row, {
        body: payload.b || "",
        _encrypted: true,
        _mk: payload.mk || null,
        _mi: payload.mi || null,
      });
    } catch (err) {
      return Object.assign({}, row, { body: "🔒 Can't decrypt this message", _encrypted: true });
    }
  }

  // ---------- media ----------
  // Encrypts an image before upload; the AES key/iv travel inside the
  // encrypted message payload.
  async function encryptFileForSend(file) {
    const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, await file.arrayBuffer());
    return {
      data: new Blob([ct], { type: "application/octet-stream" }),
      mk: b64(await crypto.subtle.exportKey("raw", key)),
      mi: b64(iv),
    };
  }

  // Fetches ciphertext from Storage and decrypts to an object URL.
  async function decryptMedia(mediaPath, mkB64, miB64, mime) {
    try {
      const url = supabaseClient.storage.from("chat-media").getPublicUrl(mediaPath).data.publicUrl;
      const res = await fetch(url);
      if (!res.ok) return null;
      const key = await crypto.subtle.importKey("raw", unb64(mkB64), { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(miB64) }, key, await res.arrayBuffer());
      return URL.createObjectURL(new Blob([plain], { type: mime || "application/octet-stream" }));
    } catch (err) {
      console.error(err);
      return null;
    }
  }

  return { setupKeys, ready, cachePublicKey, encryptOutgoing, decryptRow, encryptFileForSend, decryptMedia };
})();

  }
  if (!/^[a-z0-9_.]+$/.test(username)) {
    return "Username can contain only lowercase letters, numbers, underscores, and dots.";
  }
  return null;
}

function validatePassword(password) {
  if (password.length < 8 || password.length > 20) {
    return "Password must be 8–20 characters.";
  }
  if (!/[A-Z]/.test(password)) return "Password needs an uppercase letter.";
  if (!/[a-z]/.test(password)) return "Password needs a lowercase letter.";
  if (!/[0-9]/.test(password)) return "Password needs a number.";
  if (!/[^A-Za-z0-9]/.test(password)) return "Password needs a special character.";
  return null;
}

// ---------- Auth submit ----------
// Set right before signUp() and consumed by onAuthStateChange below: with
// email confirmation off, Supabase signs the new account straight in and
// fires a normal SIGNED_IN event, which would otherwise drop the person
// straight into the app. This flag lets that handler recognize "this
// SIGNED_IN event is the automatic one from a signup" and sign back out
// instead, so new users land on the login screen like everyone else.
let justSignedUp = false;

// The login password, stashed by the auth form and consumed once by
// enterApp → CircleCrypto.setupKeys() to unlock/create this device's
// encryption key. Never persisted — after the first login on a device the
// key itself is cached in localStorage and refreshes need no password.
let pendingPassword = null;

authForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  authError.textContent = "";

  const fullName = authFullname.value;
  const username = authName.value.trim();
  const password = authPassword.value;

  if (isSignUpMode) {
    const nameError = validateName(fullName);
    if (nameError) {
      authError.style.color = "#C4574B";
      authError.textContent = nameError;
      return;
    }
    const usernameError = validateUsername(username);
    if (usernameError) {
      authError.style.color = "#C4574B";
      authError.textContent = usernameError;
      return;
    }
    const passwordError = validatePassword(password);
    if (passwordError) {
      authError.style.color = "#C4574B";
      authError.textContent = passwordError;
      return;
    }
  }

  authSubmit.disabled = true;
  const fakeEmail = usernameToFakeEmail(username);

  try {
    if (isSignUpMode) {
      justSignedUp = true;
      const { error } = await supabaseClient.auth.signUp({
        email: fakeEmail,
        password,
        // display_name drives what shows on message bubbles / typing indicator —
        // that should be the person's name, not their (login-only) username.
        // username is also passed through so the handle_new_user() DB trigger
        // can use it directly instead of having to parse it back out of the
        // fake email address.
        options: { data: { display_name: fullName, username } },
      });
      if (error) throw error;
      // The SIGNED_IN event this triggers is handled by onAuthStateChange,
      // which signs back out and shows the login form — nothing more to do here.
    } else {
      // Set before the call: the SIGNED_IN event (and thus enterApp) can fire
      // before signInWithPassword's promise resolves.
      pendingPassword = password;
      const { error } = await supabaseClient.auth.signInWithPassword({ email: fakeEmail, password });
      if (error) {
        pendingPassword = null;
        throw error;
      }
    }
  } catch (err) {
    justSignedUp = false;
    authError.style.color = "#C4574B";
    authError.textContent = err.message.includes("already registered")
      ? "That username is taken."
      : err.message;
  } finally {
    authSubmit.disabled = false;
  }
});

signOutBtn.addEventListener("click", async () => {
  await unsubscribeFromPush();
  await supabaseClient.auth.signOut();
});

// Stop this browser from receiving push notifications once the user logs out.
// Without this, the push_subscriptions row (and the browser's own subscription)
// stays active forever, so the server keeps sending notifications even though
// nobody's logged in on this device anymore.
//
// Must run BEFORE auth.signOut(): deleting the rows needs the still-valid
// session for the table's row-level security to allow it.
async function unsubscribeFromPush() {
  const userId = currentUser?.id;
  try {
    // Cancel the browser-side subscription when we can find it. This alone
    // isn't relied on: it can come back null (permission revoked, or the
    // service worker hasn't finished registering right after a reload), and
    // any endpoint it misses would keep receiving pushes.
    if ("serviceWorker" in navigator) {
      const registration = await navigator.serviceWorker.getRegistration();
      const subscription = registration
        ? await registration.pushManager.getSubscription()
        : null;
      if (subscription) await subscription.unsubscribe();
    }

    // Delete every subscription row for this user, not just this device's
    // endpoint — stale rows from earlier logins would otherwise keep the
    // notifications coming. This is what actually stops the server sending.
    if (userId) {
      const { error } = await supabaseClient
        .from("push_subscriptions")
        .delete()
        .eq("user_id", userId);
      if (error) console.error(error);
    }
  } catch (err) {
    console.error(err);
  }
}

// ---------- Session handling ----------
supabaseClient.auth.onAuthStateChange((_event, session) => {
  if (session?.user) {
    // With email confirmation off, signUp() above immediately establishes a
    // session and fires this same SIGNED_IN event — intercept that one case
    // and sign back out instead of entering the app, so new accounts land on
    // the login screen instead of being dropped straight into a chat.
    if (justSignedUp) {
      justSignedUp = false;
      const createdUsername = session.user.user_metadata?.username || "";
      supabaseClient.auth.signOut().then(() => {
        switchToSignInMode({
          prefillUsername: createdUsername,
          message: "Account created — sign in to continue.",
        });
      });
      return;
    }
    // Supabase re-fires this event (e.g. TOKEN_REFRESHED) whenever the tab
    // regains focus/visibility, not just on real sign-in. Without this guard,
    // switching back to this tab after opening a media file would re-run the
    // whole enter flow and open duplicate realtime/typing channels on every
    // focus. Only run the full init when this is actually a different/new
    // session.
    if (currentUser?.id === session.user.id) return;
    currentUser = session.user;
    enterApp();
  } else {
    resetToAuthScreen();
  }
});

// Tears everything user-specific down and lands back on the login form.
// Shared by real sign-outs and by "this account was deleted server-side"
// (handleProfileDeleted), which needs the exact same reset.
function resetToAuthScreen() {
  currentUser = null;
  currentPartner = null;
  closeConversation();
  // Leaving also stops broadcasting presence: removing the channel sends the
  // leave, so other users' dots go gray immediately rather than waiting for
  // the socket to time out. Clear the local set too so no dot outlives it.
  if (presenceChannel) {
    supabaseClient.removeChannel(presenceChannel).catch(() => {});
    presenceChannel = null;
  }
  onlineUsers = new Set();
  renderPresence();
  // Sign-out removed this user's push subscription rows, so allow
  // subscribeToPush to run again if they sign back in this session.
  pushSubscribedForUser = null;
  document.documentElement.classList.remove("has-session");
  // Desktop two-pane: drop the signed-in shell so the desktop layout CSS
  // stops force-showing the chats list next to the auth screen.
  document.documentElement.classList.remove("app-visible");
  showEl(authScreen);
  hideEl(chatsScreen);
  hideEl(chatScreen);
  setAppHeight();
}

// ---------- Live profile updates ----------
// Someone renaming themselves in Settings should show up in everyone's open
// tab immediately: update the cache and patch the DOM in place (name labels,
// quoted replies, typing indicator) rather than re-rendering the whole list,
// which would reset scroll position for other viewers.
function buildProfilesChannel() {
  const channel = supabaseClient
    .channel("public:profiles")
    .on(
      "postgres_changes",
      { event: "UPDATE", schema: "public", table: "profiles" },
      (payload) => {
        const { id, display_name, username } = payload.new;
        // Cache the username before the display-name early return below so a
        // username-only change still lands (and can't be missed).
        if (id && username) usernameCache[id] = username;
        if (!id || profileCache[id] === display_name) return;
        profileCache[id] = display_name;

        // The row elements know their sender via dataset.msgId -> message,
        // but simpler: walk rows and match the cached message's sender.
        for (const row of messageList.querySelectorAll(".msg-row")) {
          const msg = messageCache[row.dataset.msgId];
          if (!msg) continue;
          if (msg.sender_id === id) {
            const nameEl = row.querySelector(".sender-name");
            if (nameEl) nameEl.textContent = display_name;
          }
          // Quoted names show the *quoted* message's sender ("You" for own
          // quotes), so only patch when the original was written by this user.
          if (msg.reply_to) {
            const original = messageCache[msg.reply_to];
            if (original && original.sender_id === id) {
              const qName = row.querySelector(".quoted-name");
              if (qName && qName.textContent !== "You") qName.textContent = display_name;
            }
          }
        }

        // A rename mid-typing should update the "… is typing" text too
        if (activeTypers[id]) {
          activeTypers[id] = display_name;
          renderTypingIndicator();
        }

        // ...and the conversation header / chats-list rows showing that name
        if (currentPartner === id) {
          chatPartnerName.textContent = display_name;
          updatePartnerNameTitle();
        }
        if (!chatsScreen.classList.contains("hidden") || isDesktopLayout()) renderChatList();
        if (replyingTo && replyingTo.sender_id === id) {
          replyPreviewName.textContent = display_name;
        }
      }
    )
    // A profiles row vanishing means that account was deleted server-side
    // (admin action in the Supabase dashboard) — react to it live.
    .on(
      "postgres_changes",
      { event: "DELETE", schema: "public", table: "profiles" },
      (payload) => handleProfileDeleted(payload.old?.id)
    )
    .subscribe();
  return channel;
}

// Someone was deleted from Supabase auth. For everyone else this removes
// their name, chat entries and any open conversation with them on the spot;
// for the deleted account's own tab (its JWT is still valid, so realtime
// still delivers the event) it forces an immediate logout.
async function handleProfileDeleted(id) {
  if (!id || !currentUser) return;

  if (id === currentUser.id) {
    // The push rows can still be removed while the orphaned session's JWT is
    // valid; then sign out — the SIGNED_OUT event runs resetToAuthScreen().
    await unsubscribeFromPush();
    await supabaseClient.auth.signOut();
    // Belt: reset even if no SIGNED_OUT event came back (idempotent if it did).
    if (currentUser) resetToAuthScreen();
    return;
  }

  clearTyping(id);
  delete profileCache[id];
  delete usernameCache[id];
  delete chatSummaries[id];

  if (currentPartner === id) {
    // Standing in a conversation whose other side no longer exists — kick
    // back to the chats list (replaceState so back can't re-enter it).
    try { history.replaceState(null, ""); } catch (e) {}
    goBackToChats();
    return;
  }
  if (!chatsScreen.classList.contains("hidden") || isDesktopLayout()) renderChatList();
}

async function enterApp() {
  // The flash-prevention "has-session"/"has-open-chat" classes (set in
  // <head>, before this real auth check ran) have CSS overrides that
  // force-show #chats-screen or #chat-screen even while they carry the
  // "hidden" class, specifically so the right screen is visible during that
  // brief pre-JS window on a refresh. Once we're here, real classList
  // toggling takes over for the rest of the session — so drop them,
  // otherwise those overrides keep outranking every future .hidden toggle.
  document.documentElement.classList.remove("has-session");
  document.documentElement.classList.remove("has-open-chat");
  // Desktop two-pane: marks the signed-in shell so the desktop layout CSS
  // (chats list pane + conversation pane) applies — removed again on
  // sign-out so the overrides can't leak onto the auth screen.
  document.documentElement.classList.add("app-visible");
  hideEl(authScreen);
  setAppHeight();

  // Open the realtime websocket NOW, before the crypto/profile round trips
  // below: supabase-js only connects the socket lazily when the first channel
  // subscribes, which otherwise serialized the TLS+websocket handshake behind
  // setupKeys() and loadProfiles() — the first few seconds after login were a
  // dead window where incoming messages couldn't reach the app at all.
  // Connecting here overlaps the handshake with that work. ensureRealtime()
  // below remains idempotent and still owns the channel lifecycle.
  supabaseClient.realtime.connect();

  // Unlock (or first-time create) this device's encryption key before any
  // message can render — the login password is only in hand on an active
  // sign-in; afterwards the key is cached locally and this is instant.
  const keysReady = await CircleCrypto.setupKeys(currentUser.id, pendingPassword);
  pendingPassword = null;
  if (!keysReady) {
    console.warn(
      "Encryption key unavailable — messages will be sent unencrypted and encrypted ones can't be read until you sign out and back in."
    );
  }

  // If a conversation was still open the last time this tab loaded (e.g. the
  // user refreshed the page), reopen it instead of dropping back to the
  // chats list.
  const savedPartner = getStoredOpenChat();
  // Desktop two-pane: when a conversation is about to be reopened, reveal
  // the right pane right away instead of showing the placeholder until
  // openConversation() runs (after profiles load). No-op on mobile.
  if (savedPartner) document.documentElement.classList.add("chat-open");

  loadProfiles().then(() => {
    // ensureRealtime() is idempotent: sign out/back in within this tab, tab
    // refocuses and the periodic sync all reuse healthy channels instead of
    // stacking duplicates (each duplicate would process — and render — every
    // message event multiple times).
    ensureRealtime();
    if (savedPartner) {
      chatsScreen.classList.add("hidden");
      loadChatSummaries();
      // replace=true: the refresh already reused this history entry, so
      // re-opening must not push a duplicate chat entry behind back.
      openConversation(savedPartner, true);
    } else {
      currentPartner = null;
      document.documentElement.classList.remove("chat-open");
      chatScreen.classList.add("hidden");
      chatsScreen.classList.remove("hidden");
      loadChatSummaries();
    }
  });
}

// ---------- Remember which conversation is open, across refreshes ----------
function getStoredOpenChat() {
  try {
    return sessionStorage.getItem("circle-open-chat");
  } catch (e) {
    return null;
  }
}

function setStoredOpenChat(partnerId) {
  try {
    sessionStorage.setItem("circle-open-chat", partnerId);
  } catch (e) {}
}

function clearStoredOpenChat() {
  try {
    sessionStorage.removeItem("circle-open-chat");
  } catch (e) {}
}

// Hover tooltip for the chat header name: reveals the partner's username —
// the sign-in handle used to search for them — alongside their display name.
// Uses the styled data-tip bubble (same system as the header icon buttons);
// the attribute is removed entirely while the username isn't cached, since an
// empty data-tip would still render an empty bubble. Stays in sync wherever
// the header name is rewritten.
function updatePartnerNameTitle() {
  const username = currentPartner ? usernameCache[currentPartner] : null;
  if (username) {
    chatPartnerName.dataset.tip = `@${username}`;
  } else {
    chatPartnerName.removeAttribute("data-tip");
  }
}

// ---------- Conversation navigation ----------
// Each opened conversation gets its own history entry, so the phone's /
// browser's back button walks back out of a chat to the chats list instead
// of leaving the site. `replace` (used when a refresh reopens the saved
// conversation) swaps the state on the current entry rather than stacking
// a duplicate one.
async function openConversation(partnerId, replace = false) {
  currentPartner = partnerId;
  setStoredOpenChat(partnerId);
  try {
    if (replace || history.state?.circleChat) {
      history.replaceState({ circleChat: partnerId }, "");
    } else {
      history.pushState({ circleChat: partnerId }, "");
    }
  } catch (e) {}
  // The screen switch below must happen BEFORE any network awaits — awaiting
  // the partner's profile name first left the user staring at the chats list
  // for a full round trip after tapping a chat. Show "…" and fill the name
  // in when it arrives.
  chatPartnerName.textContent = profileCache[partnerId] || "…";
  updatePartnerNameTitle();
  // Paint the online dot straight from the last presence sync instead of
  // waiting for the next sync event to repaint it.
  renderPresence();
  // Opening the chat reads everything, so its unread badge is stale from
  // here on (markConversationSeen persists this in the database).
  if (chatSummaries[partnerId]) chatSummaries[partnerId].unread = 0;

  hideEl(chatsScreen);
  showEl(chatScreen);
  setAppHeight();
  // Desktop two-pane: reveal the right pane (until now the placeholder was
  // showing) and repaint the still-visible left pane so this conversation's
  // unread badge clears and its row gets the active highlight.
  document.documentElement.classList.add("chat-open");
  renderChatListIfVisible();
  updateActiveChatItem();
  if (!profileCache[partnerId]) {
    ensureProfileCached(partnerId).then((name) => {
      if (name && currentPartner === partnerId) {
        chatPartnerName.textContent = name;
        updatePartnerNameTitle();
      }
    });
  }
  // Clear out the previous conversation's messages immediately, rather than
  // leaving them on screen until loadMessages()'s fetch resolves — otherwise
  // there's a visible flash of stale content right after the screen switches.
  clearMessageList();
  cancelReply();
  hideComposerError();
  userSearch.value = "";
  hideSearchResults();

  // Neither the typing channel nor the seen-marking depends on the history
  // fetch — start them first so the channel join and the seen UPDATE overlap
  // the loadMessages round trip instead of queuing behind it.
  subscribeTyping();
  markConversationSeen();
  await loadMessages();
}

function closeConversation() {
  // Detach the typing broadcast for this conversation so signals from it
  // stop arriving while browsing the chats list (or after sign-out).
  if (typingChannel) {
    supabaseClient.removeChannel(typingChannel);
    typingChannel = null;
  }
  Object.keys(activeTypers).forEach(clearTyping);
  hideEl(chatScreen);
  currentPartner = null;
  // No conversation open means the header dot has no partner to show.
  renderPresence();
  clearStoredOpenChat();
  // Desktop two-pane: the conversation pane fades out in its own spot (the
  // desktop CSS keeps fading screens in flow), so .chat-open must stay until
  // that fade finishes — removing it now would display:none the pane and cut
  // the fade to a hard cut. After the fade, hand the space to the placeholder
  // and fade IT in the same way. Reopening a conversation in the meantime
  // cancels the swap (the guard below sees a partner again).
  if (isDesktopLayout()) {
    clearTimeout(desktopChatCloseTimer);
    desktopChatCloseTimer = setTimeout(() => {
      if (currentPartner) return;
      document.documentElement.classList.remove("chat-open");
      showEl(chatPlaceholder);
    }, FADE_MS);
  } else {
    document.documentElement.classList.remove("chat-open");
  }
  updateActiveChatItem();
}

// Pending desktop hand-off from conversation pane back to the placeholder.
let desktopChatCloseTimer = null;

async function goBackToChats() {
  closeConversation();
  showEl(chatsScreen);
  setAppHeight();
  // Paint immediately from the summaries we already hold (kept up to date by
  // the realtime handlers and optimistic sends) instead of blocking on a
  // network fetch — then re-sync in the background in case anything was
  // missed, which just quietly re-renders the same list.
  renderChatList();
  loadChatSummaries();
}

// In-app back arrow: unwind the history entry so the phone's back button and
// this arrow stay in sync (both end up on the chats-list entry).
backButton.addEventListener("click", () => {
  if (history.state?.circleChat && history.length > 1) {
    history.back(); // the popstate handler below does the actual switch
  } else {
    // Hard-loaded straight into a chat with nothing to unwind: close
    // manually and clear the state so the phone's back button can't
    // re-enter a stale conversation afterwards.
    try { history.replaceState(null, ""); } catch (e) {}
    goBackToChats();
  }
});

// Phone/browser back or forward: mirror the UI to whatever entry we landed on.
window.addEventListener("popstate", (e) => {
  if (currentPartner && !e.state?.circleChat) {
    goBackToChats();
  } else if (!currentPartner && e.state?.circleChat) {
    openConversation(e.state.circleChat, true);
  }
});

// ---------- Header name: tap must not select, hold must ----------
// On mobile, a tap on the partner's name whose finger drifts a few pixels (or
// a quick double-tap) makes the browser run its text-selection drag and leave
// a blue ::selection box over the name. Selection there should only ever come
// from a deliberate hold, so when the touch that just ended was short,
// collapse whatever selection it produced. Touches that lasted past the
// long-press threshold are left alone, so hold-to-select keeps working.
const HOLD_SELECT_MS = 400; // Android/iOS select on holds of roughly 500ms
let nameTouchStartedAt = 0;
chatPartnerName.addEventListener("touchstart", () => {
  nameTouchStartedAt = Date.now();
}, { passive: true });
chatPartnerName.addEventListener("touchend", () => {
  if (Date.now() - nameTouchStartedAt >= HOLD_SELECT_MS) return;
  // The highlight is painted at touch-up, after this handler runs, so
  // collapsing synchronously could miss it — wait a beat instead.
  setTimeout(() => {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed) sel.removeAllRanges();
  }, 50);
}, { passive: true });

// ---------- Profiles ----------
async function loadProfiles() {
  const { data, error } = await supabaseClient.from("profiles").select("id, display_name, username, public_key");
  if (error) return console.error(error);
  profileCache = Object.fromEntries(data.map((p) => [p.id, p.display_name]));
  usernameCache = Object.fromEntries(data.filter((p) => p.username).map((p) => [p.id, p.username]));
  data.forEach((p) => CircleCrypto.cachePublicKey(p.id, p.public_key));
}

// ---------- Chats list ----------
// Builds the conversation list from the most recent messages: group by
// partner (whoever of sender/recipient isn't me), keep each partner's latest
// message as the row preview, and count messages I received but haven't seen.
async function loadChatSummaries() {
  const { data, error } = await supabaseClient
    .from("messages")
    .select("id, sender_id, recipient_id, body, media_path, created_at, seen_at")
    .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
    .order("created_at", { ascending: false })
    .limit(200);
  if (error) return console.error(error);

  chatSummaries = {};
  for (const msg of data) {
    const partner = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
    const s = (chatSummaries[partner] ||= { last: null, unread: 0 });
    if (!s.last) s.last = msg;
    if (msg.recipient_id === currentUser.id && !msg.seen_at) s.unread++;
  }
  // Last messages of conversations can be encrypted — resolve each preview
  // (instant no-op for legacy plaintext rows) before painting the list.
  await Promise.all(Object.values(chatSummaries).map(setSummaryPreview));
  renderChatList();
}

// Resolves a conversation's chats-list preview text from its last message
// (decrypting it when needed) into s.preview.
async function setSummaryPreview(s) {
  if (!s.last) return;
  try {
    const view = await CircleCrypto.decryptRow(s.last);
    s.preview = previewText(view);
  } catch (e) {
    s.preview = "";
  }
}

function previewText(msg) {
  if (msg.media_path) return "📷 Photo";
  return msg.body || "";
}

function timeLabel(iso) {
  const d = new Date(iso);
  const now = new Date();
  const sameDay =
    d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  // hour12 forces AM/PM everywhere — a bare toLocaleTimeString follows the
  // device's locale/clock setting, which renders 24-hour on many phones.
  if (sameDay) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: true });
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

// Rebuilding the list resets its scroll position and tap/hover states, so
// skip the work when nothing visible changed — the periodic background
// re-sync runs this often on a healthy client, where it's a pure no-op.
let lastChatListSignature = null;

// ---------- Desktop two-pane helpers ----------
// The desktop layout (min-width: 768px in index.html) keeps the chats list
// visible in a left pane even while a conversation is open — the list pane
// still carries the mobile flow's "hidden" class underneath, so visibility
// checks and repaints must account for it.
function isDesktopLayout() {
  return window.matchMedia("(min-width: 768px)").matches;
}

function renderChatListIfVisible() {
  if (!chatsScreen.classList.contains("hidden") || isDesktopLayout()) renderChatList();
}

// Highlights the row of the conversation currently open in the desktop right
// pane (a no-op for row state on mobile, where no list is visible in a chat).
function updateActiveChatItem() {
  chatList.querySelectorAll(".chat-item").forEach((item) => {
    item.classList.toggle("active", item.dataset.partner === currentPartner);
  });
}

function renderChatList() {
  const partners = Object.keys(chatSummaries).sort(
    (a, b) => new Date(chatSummaries[b].last.created_at) - new Date(chatSummaries[a].last.created_at)
  );
  const signature = partners
    .map(
      (p) =>
        `${p}:${chatSummaries[p].last?.id}:${chatSummaries[p].unread}:${profileCache[p] ?? ""}:${chatSummaries[p].preview ?? ""}:${onlineUsers.has(p) ? 1 : 0}`
    )
    .join("|");
  if (signature === lastChatListSignature) return;
  lastChatListSignature = signature;

  chatList.innerHTML = "";

  if (partners.length === 0) {
    const empty = document.createElement("div");
    empty.className = "chat-list-empty";
    empty.textContent = "No chats yet — search for a username above to start one.";
    chatList.appendChild(empty);
    return;
  }

  for (const partner of partners) {
    const s = chatSummaries[partner];
    const item = document.createElement("div");
    item.className = "chat-item";
    item.dataset.partner = partner;
    if (partner === currentPartner) item.classList.add("active");
    item.setAttribute("role", "button");
    item.tabIndex = 0;

    const info = document.createElement("div");
    info.className = "chat-item-info";

    const top = document.createElement("div");
    top.className = "chat-item-top";
    const name = document.createElement("span");
    name.className = "chat-item-name";
    name.textContent = profileCache[partner] || "Someone";
    const time = document.createElement("span");
    time.className = "chat-item-time";
    time.textContent = timeLabel(s.last.created_at);
    // The online dot only shows in the open chat's header now — chats-list
    // rows no longer append one here.
    const right = document.createElement("span");
    right.className = "chat-item-right";
    right.appendChild(time);
    top.appendChild(name);
    top.appendChild(right);

    const bottom = document.createElement("div");
    bottom.className = "chat-item-bottom";
    const preview = document.createElement("span");
    preview.className = "chat-item-preview";
    // When the last message in a conversation is mine, show its delivery
    // tick ahead of the text — same vocabulary as in the chat itself — so the
    // preview is readable as "I sent this" without any extra label.
    if (s.last.sender_id === currentUser.id) {
      const tick = document.createElement("span");
      tick.className = "tick" + (s.last.seen_at ? " seen" : "");
      tick.innerHTML = s.last.seen_at ? TICK_SVG_DOUBLE : TICK_SVG_SINGLE;
      preview.appendChild(tick);
    }
    preview.appendChild(document.createTextNode(s.preview != null ? s.preview : previewText(s.last)));
    bottom.appendChild(preview);
    if (s.unread > 0) {
      const badge = document.createElement("span");
      badge.className = "chat-item-badge";
      badge.textContent = s.unread;
      bottom.appendChild(badge);
    }

    info.appendChild(top);
    info.appendChild(bottom);
    item.appendChild(info);
    item.addEventListener("click", () => openConversation(partner));
    item.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openConversation(partner);
      }
    });
    chatList.appendChild(item);
  }
}

// A new/updated message arrived while we're not inside that conversation:
// refresh the affected row's preview and unread badge.
function updateChatSummaryFor(msg) {
  const partner = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
  const s = (chatSummaries[partner] ||= { last: null, unread: 0 });
  if (!s.last || new Date(msg.created_at) >= new Date(s.last.created_at)) {
    s.last = msg;
    // Blank placeholder while the preview decrypts (near-instant for
    // plaintext); setSummaryPreview re-renders with the real text.
    s.preview = "";
    setSummaryPreview(s).then(() => {
      if (!chatsScreen.classList.contains("hidden") || isDesktopLayout()) renderChatList();
    });
  }
  if (msg.recipient_id === currentUser.id && !msg.seen_at && currentPartner !== partner) s.unread++;
  // A brand-new contact's first message would otherwise sit as "Someone"
  // until the next full reload — pull the name and repaint the row with it.
  if (!profileCache[partner]) {
    ensureProfileCached(partner).then(() => {
      if (!chatsScreen.classList.contains("hidden") || isDesktopLayout()) renderChatList();
    });
  }
  if (!chatsScreen.classList.contains("hidden") || isDesktopLayout()) renderChatList();
}

// ---------- User search ----------
let searchDebounce = null;

// Usernames are 5–10 characters (see validateUsername). Only search once a
// full username could actually have been typed — partial/mid-typing input
// shouldn't surface suggestions.
const USERNAME_MIN_LENGTH = 5;

userSearch.addEventListener("input", () => {
  clearTimeout(searchDebounce);
  const term = userSearch.value.trim().toLowerCase();
  if (term.length < USERNAME_MIN_LENGTH) {
    hideSearchResults();
    return;
  }
  searchDebounce = setTimeout(() => runUserSearch(term), 250);
});

async function runUserSearch(term) {
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, display_name, username, public_key")
    .eq("username", term)
    .neq("id", currentUser.id)
    .limit(10);
  if (error) return console.error(error);

  searchResults.innerHTML = "";
  if (data.length === 0) {
    const empty = document.createElement("div");
    empty.className = "search-empty";
    empty.textContent = `No user "@${term}" found.`;
    searchResults.appendChild(empty);
  } else {
    for (const p of data) {
      profileCache[p.id] = p.display_name;
      if (p.username) usernameCache[p.id] = p.username;
      CircleCrypto.cachePublicKey(p.id, p.public_key);
      const row = document.createElement("div");
      row.className = "search-result";
      row.setAttribute("role", "button");
      row.tabIndex = 0;
      const name = document.createElement("span");
      name.className = "search-result-name";
      name.textContent = p.display_name;
